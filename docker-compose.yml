services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: faculty-leave-system:latest
    container_name: faculty-leave-app
    ports:
      - "3000:80"
    restart: unless-stopped
